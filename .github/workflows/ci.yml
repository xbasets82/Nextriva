name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Calidad estática y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Comprobar versiones fijadas en el proyecto
        run: |
          node --version
          pnpm --version
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.versions.node !== p.engines.node) process.exit(1)"
          test "$(pnpm --version)" = "$(node -p "require('./package.json').engines.pnpm")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Formato de configuración CI
        run: >-
          pnpm exec prettier --check .github/workflows/ci.yml .github/dependabot.yml
          .github/audit-baseline.json scripts/audit-baseline.mjs
          scripts/audit-baseline.test.mjs scripts/check-audit-baseline.mjs
          scripts/generate-api-types.mjs scripts/generate-api-types.test.mjs
          scripts/test-integration.mjs scripts/test-database-config.mjs
          scripts/test-database-config.test.mjs
          scripts/test-output.mjs scripts/test-output.test.mjs
          scripts/backup-restore.mjs scripts/backup-restore.d.mts
          scripts/test-backup-restore.test.mjs scripts/backup-demo-postgres.mjs
          scripts/backup-demo-postgres.test.mjs scripts/proton-gpg-credentials.mjs
          scripts/run-demo-backup.mjs scripts/run-demo-backup.test.mjs
          .github/workflows/deploy.yml .github/workflows/auto-deploy.yml
          scripts/cd-*.mjs scripts/test-cd-postgres.mjs
      - run: pnpm lint
      - name: Probar configuración local aislada de PostgreSQL
        run: >-
          node --test scripts/test-database-config.test.mjs
          scripts/test-output.test.mjs scripts/test-backup-restore.test.mjs
      - name: Probar automatización de copias de demo
        run: pnpm test:backup-demo
      - name: Verificar guardas y simulación local de publicación
        run: pnpm test:cd
      - name: Revisar seguridad y estilo de scripts CD
        run: pnpm exec eslint scripts/cd-*.mjs scripts/test-cd-postgres.mjs
      - name: Preparar entorno sintético para generar Prisma Client
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.env.local', [
            'NEXTRIVA_DEV_USER=nextriva_ci_dev',
            'NEXTRIVA_DEV_PASSWORD=synthetic_ci_dev_only',
            'DATABASE_URL=postgresql://nextriva_ci_dev:synthetic_ci_dev_only@127.0.0.1:5432/nextriva_dev',
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
      - name: Generar Prisma Client sin conexión a PostgreSQL
        run: pnpm --filter @nextriva/api db:generate
      - name: Verificar contrato OpenAPI y tipos web
        run: pnpm api:types:check
      - name: Probar destino de generación OpenAPI
        run: node --test scripts/generate-api-types.test.mjs
      - run: pnpm typecheck
      - run: pnpm build

  unit-coverage:
    name: Unitarias y cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSKY: '0'
      NEXTRIVA_TEST_USER: nextriva_ci_test
      NEXTRIVA_TEST_PASSWORD: synthetic_ci_test_only
      TEST_DATABASE_URL: postgresql://nextriva_ci_test:synthetic_ci_test_only@127.0.0.1:5433/nextriva_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Comprobar versiones fijadas en el proyecto
        run: |
          node --version
          pnpm --version
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.versions.node !== p.engines.node) process.exit(1)"
          test "$(pnpm --version)" = "$(node -p "require('./package.json').engines.pnpm")"
      - run: pnpm install --frozen-lockfile
      - name: Unitarias y cobertura con umbrales configurados
        run: pnpm -r --if-present test:coverage
      - name: Conservar informes de cobertura aunque fallen las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/api/coverage/
            apps/web/coverage/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Integración PostgreSQL temporal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSKY: '0'
      NEXTRIVA_TEST_USER: nextriva_ci_test
      NEXTRIVA_TEST_PASSWORD: synthetic_ci_test_only
      TEST_DATABASE_URL: postgresql://nextriva_ci_test:synthetic_ci_test_only@127.0.0.1:5433/nextriva_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Comprobar versiones fijadas en el proyecto
        run: |
          node --version
          pnpm --version
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.versions.node !== p.engines.node) process.exit(1)"
          test "$(pnpm --version)" = "$(node -p "require('./package.json').engines.pnpm")"
      - run: pnpm install --frozen-lockfile
      - name: Integración HTTP y PostgreSQL real aislado
        run: pnpm --filter @nextriva/api test:integration
      - name: Verificar publicación simulada preservando PostgreSQL aislado
        run: pnpm test:cd:postgres
      - name: Backup y restauración PostgreSQL en base temporal aislada
        run: pnpm --filter @nextriva/api test:backup-restore
      - name: Verificar rechazo sin validador independiente en PostgreSQL aislado
        run: >-
          pnpm --filter @nextriva/api exec node ../../scripts/test-integration.mjs
          --isolated-validator-test

  e2e:
    name: E2E Playwright con Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      HUSKY: '0'
      NEXTRIVA_TEST_USER: nextriva_ci_test
      NEXTRIVA_TEST_PASSWORD: synthetic_ci_test_only
      TEST_DATABASE_URL: postgresql://nextriva_ci_test:synthetic_ci_test_only@127.0.0.1:5433/nextriva_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Comprobar versiones fijadas en el proyecto
        run: |
          node --version
          pnpm --version
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.versions.node !== p.engines.node) process.exit(1)"
          test "$(pnpm --version)" = "$(node -p "require('./package.json').engines.pnpm")"
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium y dependencias del sistema fijados por Playwright
        run: pnpm --filter @nextriva/api exec playwright install --with-deps chromium
      - name: E2E con API, frontend, Chromium y PostgreSQL temporal reales
        run: pnpm --filter @nextriva/api test:e2e
      - name: Conservar informe y trazas Playwright aunque fallen las pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/api/test-results/
            apps/api/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Auditoría pnpm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:audit-baseline
      - name: Auditar dependencias y conservar el informe completo
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit --json > pnpm-audit.json
          audit_exit_code=$?
          set -e
          echo "exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"
      - name: Evaluar únicamente las excepciones temporales exactas
        run: >-
          node scripts/check-audit-baseline.mjs
          --report pnpm-audit.json
          --baseline .github/audit-baseline.json
          --audit-exit-code '${{ steps.audit.outputs.exit_code }}'
      - name: Conservar el resultado de auditoría aunque falle la evaluación
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: pnpm-audit.json
          if-no-files-found: warn
          retention-days: 7

  validation:
    name: Calidad, pruebas y build
    needs: [static-quality, unit-coverage, integration, e2e, audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir éxito de todos los controles
        env:
          STATIC_QUALITY_RESULT: ${{ needs.static-quality.result }}
          UNIT_COVERAGE_RESULT: ${{ needs.unit-coverage.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$STATIC_QUALITY_RESULT" = success
          test "$UNIT_COVERAGE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$E2E_RESULT" = success
          test "$AUDIT_RESULT" = success
