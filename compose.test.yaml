name: nextriva

services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: nextriva_test
      POSTGRES_USER: ${NEXTRIVA_TEST_USER:?Set NEXTRIVA_TEST_USER explicitly}
      POSTGRES_PASSWORD: ${NEXTRIVA_TEST_PASSWORD:?Set NEXTRIVA_TEST_PASSWORD explicitly}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - nextriva_test_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  nextriva_test_data:
    name: nextriva_test_data
